name = "7amai-signup"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
SITE = "https://7amai.com"
FROM = "7am AI <brief@7amai.com>"
# Segment-ID'er fra Resend (Audience > Segments). Ikke hemmelige; sættes, når segmenterne er oprettet.
SEGMENT_EN = "9df4ffd3-4a15-4e18-a2ec-15b3ad3ff93e"
SEGMENT_DA = "dc0facb5-533c-4b69-babc-9e0017206d5d"

# Anonym besøgsstatistik (POST /hit). Samme database læses af dashboardet i worker/stats. EU (weur).
[[d1_databases]]
binding = "DB"
database_name = "7amai-stats"
database_id = "4f2e0520-82ad-4ffd-a1f2-17decfb4741d"

# Hemmeligheder sættes med `npx wrangler secret put <NAVN>` og ligger aldrig i repoet:
#   RESEND_API_KEY   (Resend-nøgle med fuld adgang)
#   SIGNING_SECRET   (lang tilfældig streng)
#   BROADCAST_TOKEN  (lang tilfældig streng; samme værdi lægges som network secret i 7am-ai-miljøet)
