<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only" />
<meta name="supported-color-schemes" content="light" />
<title>7am AI</title>
</head>
<body style="margin:0;padding:0;background:#EEF3FA;">
<div style="display:none;max-height:0;overflow:hidden;">{{PREHEADER}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EEF3FA;">
<tr><td align="center" style="padding:24px 12px;">
{{BANNER}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#FFFFFF;border-radius:16px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#0E1A33;">
<tr><td style="padding:22px 24px 0;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
    <td style="vertical-align:middle;"><a href="{{SITE_URL}}?ref=mail" style="text-decoration:none;color:#0E1A33;"><img src="https://7amai.com/assets/logo-mail.png" width="40" height="40" alt="" style="display:inline-block;vertical-align:middle;border:0;border-radius:9px;"><span style="font-size:19px;font-weight:800;letter-spacing:-0.3px;vertical-align:middle;margin-left:8px;">7am AI</span></a></td>
    <td align="right" style="vertical-align:middle;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#55627A;">{{DATE}} · <span style="color:#B4500A;">07:00</span></td>
  </tr></table>
</td></tr>
<tr><td style="padding:14px 24px 0;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
    <td style="height:3px;line-height:3px;font-size:0;background:#0E1A33;">&nbsp;</td>
    <td width="18" style="width:18px;height:3px;line-height:3px;font-size:0;background:#FF8A2A;">&nbsp;</td>
  </tr></table>
</td></tr>
<tr><td style="padding:18px 24px 6px;">
  <div style="font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#55627A;">{{COUNT}} · {{MIN}} min read</div>
  <h1 style="font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-0.4px;margin:8px 0 8px;color:#0E1A33;">{{TITLE}}</h1>
  <p style="font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.5;color:#55627A;margin:0 0 12px;">{{LEAD}}</p>
  <p style="display:inline-block;font-size:12px;line-height:1.4;font-weight:600;color:#55627A;margin:0;padding:5px 12px;border:1px solid #D3DCEA;border-radius:999px;">{{DISCLOSURE}}</p>
</td></tr>
<tr><td style="padding:10px 24px 4px;">
{{ITEMS}}
</td></tr>
<tr><td style="padding:14px 24px 26px;">
  <a href="{{ISSUE_URL}}?ref=mail" style="display:inline-block;background:#FF8A2A;color:#0E1A33;text-decoration:none;font-weight:800;font-size:15px;padding:12px 22px;border-radius:999px;">Read it on 7amai.com</a>
  <span style="font-size:13px;margin-left:12px;"><a href="{{DA_URL}}?ref=mail" style="color:#55627A;">Dansk udgave</a></span>
</td></tr>
</table>
<p style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;color:#55627A;margin:16px 0 0;">7am AI · every day at 7am · under 7 minutes · <a href="{{SITE_URL}}?ref=mail" style="color:#55627A;">archive</a></p>
</td></tr>
</table>
</body>
</html>

<!--
BYGGEKLODSER (First Light). Mailen bruger kun skrifttyper, der findes på alle enheder
(Helvetica/Arial til overskrifter og mærker, Georgia til brødtekst), og logoet er et PNG,
fordi Gmail ikke viser SVG. Alt på solorange og guld har natblå tekst (#0E1A33).

{{COUNT}} = fx "5 stories" (dansk mail: "5 historier"). {{MIN}} = udgavens læsetid.

{{ITEMS}} = historierne i rækkefølge, hver som ét blok. Mellem blokkene en streg:
<div style="height:1px;line-height:1px;font-size:0;background:#D3DCEA;margin:4px 0;">&nbsp;</div>

Én historie:
<div style="padding:14px 0;">
  <span style="display:inline-block;font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;border-radius:999px;{{SIGNAL_STYLE}}">{{SIGNAL}}</span>
  <span style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#55627A;margin-left:6px;">{{MIN_ITEM}} min</span>
  {{NUMBER}}
  <a href="{{ISSUE_URL}}?ref=mail#{{ANKER}}" style="display:block;font-size:{{H_SIZE}};line-height:1.25;font-weight:800;color:#0E1A33;text-decoration:none;margin:8px 0 6px;">{{OVERSKRIFT}}</a>
  <p style="font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.5;margin:0 0 8px;color:#0E1A33;">{{EN_TIL_TO_SAETNINGER}}</p>
  <p style="font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.5;margin:0 0 8px;padding:8px 12px;background:#FFF4EA;border-left:3px solid #FF8A2A;color:#0E1A33;"><strong style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">So what:</strong> {{SO_WHAT}}</p>
  <span style="font-size:11px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;color:{{SRC_COLOR}};">{{KILDEMÆRKE}} · {{DOMÆNE}}</span>
</div>

{{SIGNAL_STYLE}}:
  Big deal      = background:#FFC447;color:#0E1A33;padding:3px 9px;
  Worth knowing = border:1.5px solid #FF8A2A;color:#B4500A;padding:1.5px 7.5px;
  Quick hit     = border:1.5px solid #D3DCEA;color:#55627A;padding:1.5px 7.5px;
{{H_SIZE}}: første historie (lead) 21px, resten 17px.
{{NUMBER}}: kun på lead-historien og kun med et ægte nøgletal fra kilden, ellers tom:
  <div style="font-size:40px;line-height:1;font-weight:800;letter-spacing:-1px;color:#0E1A33;margin:10px 0 0;">{{TAL}}<span style="display:block;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:#55627A;font-weight:700;margin-top:4px;">{{HVAD_TALLET_ER}}</span></div>
{{KILDEMÆRKE}}: Official (SRC_COLOR #B4500A), Reported eller Unconfirmed (SRC_COLOR #55627A).
Dansk mail: "Hvad betyder det:" i stedet for "So what:", "Officiel/Rapporteret/Ubekræftet".
Har udgaven "Corrections", tilføjes de efter Paper of the day som en almindelig blok med overskriften "Corrections".

Sektionslabel (før Open source-historien og før Paper-historien; dansk: "Open source og lokal AI", "Dagens forskningsartikel"):
  <div style="font-size:11px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#55627A;margin:22px 0 2px;">{{SEKTION}}</div>

Explained-blok (til sidst efter alle historier; dansk: "Forklaret: hvis du har 2 minutter mere", "To mere fra i dag, på 7amai.com"):
  <div style="margin:24px 0 0;border-top:1.5px dashed #D3DCEA;padding-top:16px;">
    <div style="font-size:11px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#B4500A;margin:0 0 6px;">Explained: if you have 2 more minutes</div>
    <div style="font-size:20px;line-height:1.2;font-weight:800;color:#0E1A33;margin:0 0 8px;">{{BEGREB_TITEL}}</div>
    {{BEGREB_TEKST}}  (hovedbegrebets brødtekst som afsnit: <p style="font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.55;margin:0 0 10px;color:#0E1A33;">; sammenligningen i <p style="...;background:#FFF4EA;border-left:3px solid #FF8A2A;padding:8px 12px;">)
    <div style="margin:14px 0 0;padding:12px 14px;background:#EEF3FA;border-radius:12px;">
      <div style="font-size:13px;font-weight:800;color:#55627A;margin:0 0 6px;">Two more from today, on 7amai.com</div>
      <a href="https://7amai.com/explained/{{SLUG}}/?ref=mail" style="display:block;font-size:15px;font-weight:700;color:#0E1A33;margin:4px 0;text-decoration:none;"><span style="color:#B4500A;">&rarr;</span> {{TITEL}}</a>
      (ét link pr. ekstra begreb; dansk: https://7amai.com/da/explained/{{SLUG}}/?ref=mail)
    </div>
  </div>

{{DISCLOSURE}}: ikke godkendt = "Written by AI. Every claim links to its primary source. Not reviewed by a human editor."
                kontrolleret = "Written by AI and checked against our editorial standards. Every claim links to its primary source. Not reviewed by a human editor."
                godkendt     = "Reviewed by Jesper. Written with AI; every claim links to its primary source."

{{BANNER}} er tom i den endelige mail. I udkast-mailen:
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 0 12px;"><tr><td style="background:#0E1A33;border-radius:14px;padding:16px 20px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#FFFFFF;">
<div style="font-size:12px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:#FFC447;">Draft · sends at 07:00</div>
<p style="font-size:14px;line-height:1.5;margin:6px 0 12px;color:#FFFFFF;">Merge the pull request before 07:00 and this issue goes out as "Reviewed by Jesper". You can edit the text in the PR first. If you do nothing, it goes out at 07:00 labelled as AI-written.{{FREDAG}}</p>
<a href="{{PR_URL}}" style="display:inline-block;background:#FF8A2A;color:#0E1A33;text-decoration:none;font-weight:800;font-size:15px;padding:10px 18px;border-radius:999px;">Approve on GitHub</a>
</td></tr></table>

{{FREDAG}} (kun fredag): " Want to add Jesper's pick? Add a '## Jesper's pick' section at the bottom of the file in the PR."
-->
