# "Shipped or not?": what AI companies promised with a date, and whether it came.
# Only Official sources (the company's own site, repo or model page), for both the promise and the status.
#
# status: delivered | partial | not_yet | late
# deadline: last day the company itself named
# status_on: the day the official source shows this status. If the source does not
#   show when it happened, use the day we checked it (never a guess).
# note: optional, one short sentence, only facts from the two sources.
# issues: our own editions about it, as date + story anchor (the same anchor is used on both languages).

