title: 7am AI
description: "The AI news that matters. 7am, 7 days a week, in under 7 minutes."
lang: en
url: https://7amai.com
baseurl: ""
signup_endpoint: "https://7amai-signup.jesperkhl.workers.dev"
timezone: Europe/Copenhagen
# Udgaven dateres 07:00 men bygges foer; uden dette ville Jekyll skjule den som "fremtidig".
future: true
permalink: /:year/:month/:day/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
# Engelsk = _posts (hovedudgave, /feed.xml). Dansk = samlingen _da (/da/..., /feed/da.xml).
collections:
  da:
    output: true
    permalink: /da/:year/:month/:day/
  # "Explained"-biblioteket: én fil pr. begreb og sprog (_explained/<slug>.md og _explained/da/<slug>.md).
  explained:
    output: true
    permalink: /explained/:name/
feed:
  path: feed.xml
  collections:
    da:
      path: feed/da.xml
defaults:
  - scope: { path: "", type: posts }
    values: { layout: issue, lang: en }
  - scope: { path: "", type: da }
    values: { layout: issue, lang: da }
  - scope: { path: "_explained", type: explained }
    values: { layout: explained, lang: en }
  - scope: { path: "_explained/da", type: explained }
    values: { layout: explained, lang: da, permalink: "/da/explained/:name/" }
exclude:
  - README.md
  - CLAUDE.md
  - STRATEGI.md
  - worker
